# Local SQL Server demo. Do not expose this Development configuration publicly.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
  web:
    build: .
    ports: ['127.0.0.1:5080:8080']
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PublicOrigin: http://127.0.0.1:5080
      Database__Provider: SqlServer
      ConnectionStrings__Default: 'Server=sql;Database=MarketHub;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True'
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      SeedDemoData: 'true'
      Payments__Provider: Demo
    depends_on:
      sql:
        condition: service_healthy
    volumes:
      - app-data:/app/App_Data
volumes:
  sql-data:
  app-data:
